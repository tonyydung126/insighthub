name: IaC Pipeline

on:
  push:
    branches:
      - main
      - 'day*'
  pull_request:
    branches:
      - main

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0
      - name: Format Terraform files
        run: terraform fmt -check -recursive infra/

  lint:
    name: Terraform lint
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install tflint
        run: |
          curl -sSL https://github.com/terraform-linters/tflint/releases/download/v0.48.0/tflint_linux_amd64.zip -o /tmp/tflint.zip
          sudo unzip -o /tmp/tflint.zip -d /usr/local/bin
      - name: Run tflint
        run: |
          cd infra
          tflint --recursive

  scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Checkov
        run: python -m pip install checkov
      - name: Run Checkov on infra
        run: checkov -d infra/

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0
      - name: Terraform init
        run: |
          cd infra
          terraform init -backend=false
      - name: Terraform plan
        run: |
          cd infra
          terraform plan -out=tfplan
